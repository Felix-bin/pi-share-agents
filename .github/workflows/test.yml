name: Tests

# Fast PR gate: typecheck plus the unit and integration suites on Linux.
# Installer, loader-selection, Bun parity and official-binary coverage lives in
# deep.yml, which runs on pushes to main, weekly, and on demand.
#
# README.md and guides/** are deliberately NOT in paths-ignore: subagent-guide
# reads them from disk and test/unit/subagent-guide.test.ts asserts on their
# contents, so a documentation edit can legitimately fail this job.

on:
  push:
    branches: [main]
    paths-ignore:
      - VISION.md
      - LICENSE
      - reference/**
      - experiments/**
  pull_request:
    branches: [main]
    paths-ignore:
      - VISION.md
      - LICENSE
      - reference/**
      - experiments/**

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: node --experimental-strip-types --import ./test/support/isolated-temp-root.mjs --test test/unit/*.test.ts
      - name: Integration tests
        timeout-minutes: 10
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          PI_SUBAGENTS_TERMINAL_EVIDENCE_DIR: ${{ runner.temp }}/1906-terminal-evidence
        run: node --experimental-strip-types --import ./test/support/register-loader.mjs --test test/integration/*.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shared-cwd-terminal
          path: ${{ runner.temp }}/1906-terminal-evidence/shared-cwd-terminal.json
          if-no-files-found: ignore
